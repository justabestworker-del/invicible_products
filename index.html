<style>
/* ===============================
   ???? DAY / NIGHT TOGGLE ICON
   =============================== */

.theme-btn{
    position:absolute;
    right:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    width:52px;
    height:52px;
    border:none;
    border-radius:50%;
    cursor:pointer;
    background:linear-gradient(135deg,#ffb347,#ffcc33);
    box-shadow:
        0 0 15px rgba(255,200,0,.9),
        0 0 35px rgba(255,170,0,.8);
    transition:.5s ease;
    overflow:hidden;
}

/* ICON BASE */
.theme-btn .icon{
    position:absolute;
    font-size:22px;
    transition:.5s ease;
}

/* SUN */
.theme-btn .sun{
    opacity:1;
    transform:scale(1) rotate(0deg);
    filter:drop-shadow(0 0 8px #ffd700);
}

/* MOON */
.theme-btn .moon{
    opacity:0;
    transform:scale(0) rotate(-180deg);
    filter:drop-shadow(0 0 10px #00eaff);
}

/* ?? NIGHT MODE */
body.night .theme-btn{
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    box-shadow:
        0 0 18px rgba(0,255,255,.9),
        0 0 40px rgba(106,0,255,.9);
}

body.night .theme-btn .sun{
    opacity:0;
    transform:scale(0) rotate(180deg);
}

body.night .theme-btn .moon{
    opacity:1;
    transform:scale(1.2) rotate(0deg);
}

/* HOVER MAGIC */
.theme-btn:hover{
    transform:rotate(15deg) scale(1.1);
    box-shadow:
        0 0 30px rgba(255,255,255,1),
        0 0 70px rgba(255,170,0,1);
}

/* NIGHT HOVER */
body.night .theme-btn:hover{
    box-shadow:
        0 0 30px rgba(0,255,255,1),
        0 0 80px rgba(106,0,255,1);
}

/* PULSE ANIMATION */
.theme-btn{
    animation:themePulse 2.5s ease-in-out infinite;
}

@keyframes themePulse{
    0%{transform:scale(1)}
    50%{transform:scale(1.08)}
    100%{transform:scale(1)}
}
::-webkit-scrollbar{
    width:16px;
}

/* Track */
::-webkit-scrollbar-track{
    background:linear-gradient(
        180deg,
        #0f2027,
        #203a43,
        #2c5364
    );
    box-shadow:
        inset 0 0 12px rgba(0,0,0,.8),
        inset 0 0 30px rgba(0,0,0,.6);
}

/* Thumb */
::-webkit-scrollbar-thumb{
    border-radius:20px;
    background:linear-gradient(
        180deg,
        #ff0080,
        #ff8c00,
        #ffee00,
        #00ffea,
        #6a00ff,
        #ff0080
    );
    background-size:400% 400%;

    box-shadow:
        0 0 15px rgba(255,153,0,.9),
        0 0 35px rgba(255,94,0,.8),
        inset 0 0 8px rgba(255,255,255,.5);

    animation:
        scrollRGB 6s linear infinite,
        scrollPulse 2.2s ease-in-out infinite;
}

/* Hover BOOST */
::-webkit-scrollbar-thumb:hover{
    background-size:600% 600%;
    box-shadow:
        0 0 25px rgba(255,200,0,1),
        0 0 60px rgba(255,94,0,1),
        inset 0 0 12px rgba(255,255,255,.9);

    animation:
        scrollRGB 3s linear infinite,
        scrollPulse 1.4s ease-in-out infinite,
        scrollShake .25s infinite;
}

/* Corner */
::-webkit-scrollbar-corner{
    background:#131921;
}

/* ===============================
   ??? SCROLL ANIMATIONS
   =============================== */

@keyframes scrollRGB{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

@keyframes scrollPulse{
    0%{
        filter:brightness(1) saturate(1);
    }
    50%{
        filter:brightness(1.4) saturate(1.8);
    }
    100%{
        filter:brightness(1) saturate(1);
    }
}

@keyframes scrollShake{
    0%{transform:translateX(0)}
    25%{transform:translateX(1px)}
    50%{transform:translateX(-1px)}
    75%{transform:translateX(1px)}
    100%{transform:translateX(0)}
}

body.night ::-webkit-scrollbar-track{
    background:linear-gradient(
        180deg,
        #0b111a,
        #1a2233,
        #2c3a4f
    );
}

        0 0 18px rgba(0,255,255,.9),
        0 0 45px rgba(106,0,255,.9),
        inset 0 0 10px rgba(255,255,255,.4);
}
:root{
--navy:#131921;
--light-navy:#232f3e;
--orange:#f3a847;
--bg:#eaeded;
--text:#111;
--card-bg:#fff;
--btn-bg:#ffa41c;
}

body.night{
--navy:#0b111a;
--light-navy:#1a2233;
--orange:#ff9900;
--bg:#0f1620;
--text:#eee;
--card-bg:#1c2433;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Arial}
body{
background:var(--bg);
color:var(--text);
transition:.4s;
}

/* HEADER */
header{
background:var(--navy);
padding:14px 0;
position:sticky;
top:0;
z-index:1000;
display:flex;
align-items:center;
justify-content:center;
}

/* LOGO */
.logo{
font-size:28px;
font-weight:900;
color:#fff;
text-decoration:none;
text-shadow:0 0 15px rgba(255,164,28,.9);
animation:floatLogo 4s ease-in-out infinite;
}
.logo span{
background:linear-gradient(90deg,#ff0080,#ff8c00,#ffee00,#00ffea,#6a00ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
background-size:300%;
animation:rgbFlow 6s linear infinite;
}

/* MENU TOGGLE */
.menu-toggle{
position:absolute;
left:20px;
top:50%;
transform:translateY(-50%);
width:30px;height:22px;
display:flex;
flex-direction:column;
justify-content:space-between;
cursor:pointer;
}
.menu-toggle span{
height:3px;background:#fff;border-radius:3px;transition:.3s;
}
.menu-toggle.active span:nth-child(1){transform:rotate(45deg) translateY(9px)}
.menu-toggle.active span:nth-child(2){opacity:0}
.menu-toggle.active span:nth-child(3){transform:rotate(-45deg) translateY(-9px)}

/* THEME BTN */
#theme-toggle{
position:absolute;
right:20px;
background:var(--orange);
border:none;
padding:8px 14px;
border-radius:6px;
cursor:pointer;
font-weight:600;
}

/* CATEGORY NAV */
.category-nav{
position:fixed;
left:-260px;
top:0;
width:240px;
height:100vh;
background:var(--light-navy);
padding:90px 20px;
display:flex;
flex-direction:column;
gap:14px;
transition:.35s;
z-index:999;
}
.category-nav.open{left:0}

.cat-btn{
display:flex;
align-items:center;
gap:12px;
padding:12px 14px;
border-radius:8px;
cursor:pointer;
color:#fff;
transition:.3s;
}
.cat-btn i{
color:#ffa41c;
font-size:18px;
}
.cat-btn:hover,
.cat-btn.active{
background:#fff;
color:#131921;
font-weight:700;
}

/* CONTENT */
.container{max-width:1300px;margin:30px auto;padding:0 20px}
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:25px;
}

/* CARD */
.card{
background:var(--card-bg);
border-radius:12px;
padding:20px;
display:flex;
flex-direction:column;
animation:fade .4s forwards;
transition:.3s;
}
.card:hover{
transform:translateY(-6px);
box-shadow:0 12px 28px rgba(0,0,0,.18);
}
@keyframes fade{from{opacity:0;transform:translateY(15px)}to{opacity:1}}

.img-box{
height:200px;
display:flex;
align-items:center;
justify-content:center;
}
.img-box img{
max-width:100%;
max-height:100%;
object-fit:contain;
}
.title{color:#007185;margin:12px 0;font-weight:600}
.rating{color:#f0c14b;margin-bottom:8px}
.price{font-size:22px;font-weight:700;margin-bottom:15px}

/* BUTTON */

margin-top:auto;
background:var(--btn-bg);
color:#111;
padding:12px;
border-radius:25px;
text-align:center;
text-decoration:none;
font-weight:700;
}

@keyframes rgbFlow{
0%{background-position:0%}
100%{background-position:300%}
}
@keyframes floatLogo{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-4px)}
}
</style>
</head>

const list=document.getElementById("list");

function stars(n=4){
return "?".repeat(n)+"?".repeat(5-n);
}

function render(filter="all"){
list.innerHTML="";
products.forEach(p=>{
if(filter==="all"||p.cat===filter){
list.innerHTML+=`
<div class="card">
<div class="img-box"><img src="${p.img}"></div>
<div class="title">${p.name}</div>
<div class="rating">${stars(p.rate||4)}</div>
<div class="price">$${p.price}</div>
<a class="btn" href="${p.link}" target="_blank" rel="nofollow sponsored">
BUY ON AMAZON
</a>
</div>`;
}
});
}

function filterProducts(cat,btn){
document.querySelectorAll(".cat-btn").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
render(cat);
toggleMenu();
}

function toggleMenu(){
document.querySelector(".category-nav").classList.toggle("open");
document.querySelector(".menu-toggle").classList.toggle("active");
}

const themeBtn=document.getElementById("theme-toggle");

if(localStorage.getItem("theme")==="night"){
document.body.classList.add("night");
themeBtn.textContent="Day";
}

themeBtn.onclick=()=>{
document.body.classList.toggle("night");
const night=document.body.classList.contains("night");
themeBtn.textContent=night?"?? Day":"?? Night";
localStorage.setItem("theme",night?"night":"day");
};
document.body.classList.toggle("night");

render();
